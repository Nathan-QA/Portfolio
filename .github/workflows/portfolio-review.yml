name: Portfolio review

on:
  push:
    branches: [feat/portfolio-carnet]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Build and validate content
        run: |
          npm run build
          npm test
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run test:e2e
      - name: Review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review
          retention-days: 5
          path: |
            dist
            package-lock.json
            playwright-report
            test-results
            screenshots
