name: Portfolio review
on:
  push:
    branches: [refactor/editorial-portfolio, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-review
          path: |
            assets/
            content/
            src/
            scripts/
            dist/
            tests/
            test-results/
            playwright-report/
            playwright.config.mjs
            package.json
            package-lock.json
            vercel.json
            README.md
            IMAGE_SOURCES.md
            docs/
          retention-days: 7
          if-no-files-found: error
