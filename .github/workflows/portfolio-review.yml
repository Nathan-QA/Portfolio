name: Portfolio review

on:
  push:
    branches: [feat/portfolio-carnet]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate portfolio when the new build is present
        run: |
          if test -f scripts/build.mjs; then
            node scripts/build.mjs
            node --test tests/content.test.mjs
          fi
      - name: Package source for review
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-source
          retention-days: 5
          path: |
            assets
            content
            js
            src
            scripts
            tests
            index.html
            style.css
            README.md
            IMAGE_SOURCES.md
            package.json
            vercel.json
            docs
            dist
