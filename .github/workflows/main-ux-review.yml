name: Main-faithful UX review
on:
  push:
    branches: [fix/ux-main-faithful]
permissions:
  contents: read
concurrency:
  group: main-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-main-faithful
          path: |
            dist/
            test-results/
            docs/
            package-lock.json
          retention-days: 7
          if-no-files-found: error
